<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaCasa | Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-body">
  <div class="login-screen">
    <div class="login-card">
      <img src="assets/lacasa-mask.png" class="login-mask" alt="LaCasa Mask">
      <h1>LaCasa PS & Cafe</h1>
      <p>تسجيل الدخول للسيستم</p>

      <label>اسم المستخدم</label>
      <input id="username" value="admin" />

      <label>كلمة المرور</label>
      <input id="password" type="password" value="admin123" />

      <button class="confirm" onclick="login()">دخول</button>
      <div id="loginError" class="login-error"></div>

      <small>Default: admin / admin123</small>
    </div>
  </div>

  <script src="shared.js"></script>
  <script src="login.js"></script>
</body>
</html>
